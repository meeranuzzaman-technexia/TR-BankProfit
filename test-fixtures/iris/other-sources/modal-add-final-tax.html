<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Add Final Tax</title></head>
  <body>
    <mat-dialog-container class="mat-mdc-dialog-container mdc-dialog cdk-dialog-container mdc-dialog--open" data-kind="final-tax">
      <h6 mat-dialog-title>
        <span class="left">Add Final Tax</span><span class="right">close</span>
      </h6>
      <div class="dialog-body">
        <div class="source-card source-card--checked">
          <mat-checkbox class="mat-mdc-checkbox custom-checkbox mat-accent mat-mdc-checkbox-checked">
            <input type="checkbox" class="mdc-checkbox__native-control mdc-checkbox--selected">
          </mat-checkbox>
          <p>Profit on Debt u/s 151(1)(b) from Bank Accounts / Deposits</p>
        </div>
      </div>
      <div class="dialog-footer">
        <button type="button">ADD</button>
        <button type="button">Cancel</button>
      </div>
    </mat-dialog-container>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>IRIS Investment detail dialog capture contract</title></head>
  <body>
    <!-- Sanitized structural fixture from the user-provided IRIS MHTML.
         Fields are blank; no certificate or filing values are represented. -->
    <mat-dialog-container class="mat-mdc-dialog-container mdc-dialog cdk-dialog-container mdc-dialog--open" role="dialog" aria-modal="true">
      <div class="mat-mdc-dialog-surface mdc-dialog__surface">
        <app-adjustable-tax-generic>
          <h6 mat-dialog-title class="mat-mdc-dialog-title dialog-header">
            <span class="left">Investment</span>
            <span mat-dialog-close class="right pointer" type="button">
              <mat-icon role="img" title="Close">close</mat-icon>
            </span>
          </h6>
          <div class="content-container full-width">
            <mat-dialog-content>
              <div class="row full-width">
                <mat-form-field>
                  <input type="text" placeholder="Investment" maxlength="50" aria-required="false">
                </mat-form-field>
                <mat-form-field>
                  <textarea rows="1" placeholder="1. Account, Bond or Certificates etc.&#10;2. Current or Savings etc.&#10;3. Name of Institution" aria-required="false"></textarea>
                </mat-form-field>
              </div>
            </mat-dialog-content>
          </div>
          <mat-dialog-actions align="end" class="dialog-footer">
            <button type="button" mat-dialog-close>CLOSE</button>
            <button type="button" disabled="true">ADD</button>
          </mat-dialog-actions>
        </app-adjustable-tax-generic>
      </div>
    </mat-dialog-container>
